<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tiletown — fixture de mesure du rendu</title>
<!-- Page autonome pour tools/measure.mjs : importe src/render3d/renderer.js avec un monde de
     démonstration local (sans src/core ni src/main.js). Paramètres : ?stats=1 (affichage des
     mesures), ?stress=1 (24 × 24, ≈ 500 îlots), ?cols=&rows=&seed=, ?layer=air|water|fauna,
     ?strategy=batched|instanced, ?shadows=0, ?nomodels=1 (boîtes de remplacement). -->
<script type="importmap">
{ "imports": {
  "three": "../node_modules/three/build/three.module.js",
  "three/examples/jsm/": "../node_modules/three/examples/jsm/"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #f4efe6; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100dvh; }
  #stats { position: fixed; left: 8px; top: 8px; font: 12px/1.4 monospace; color: #333; background: rgba(255,255,255,.75); padding: 6px 8px; border-radius: 6px; white-space: pre; display: none; pointer-events: none; }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="stats"></div>
<script type="module">
import { createRenderer } from '../src/render3d/renderer.js';

const params = new URLSearchParams(location.search);
const stress = params.get('stress') === '1';
const cols = Number(params.get('cols')) || (stress ? 24 : 12);
const rows = Number(params.get('rows')) || (stress ? 24 : 16);
const seed = Number(params.get('seed')) || 12345;

// --- Aléatoire à graine (mulberry32), local à la fixture -------------------------------------
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// --- Monde de démonstration : rivière, lac, forêts, prairies, champs, collines, ville ----------
function demoWorld({ cols, rows, seed, stress }) {
  const rnd = mulberry32(seed);
  const idx = (x, y) => y * cols + x;
  const tiles = new Array(cols * rows);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    tiles[idx(x, y)] = { terrain: 'grass', flow: null, native: true, building: null, variant: Math.floor(rnd() * 4) };
  }
  // Rivière nord → sud qui serpente, 1 case de large, à l'est du centre.
  let rx = Math.floor(cols * 0.68);
  const riverX = [];
  for (let y = 0; y < rows; y++) {
    if (y > 0 && rnd() < 0.35) rx += rnd() < 0.5 ? -1 : 1;
    rx = Math.max(2, Math.min(cols - 3, rx));
    riverX.push(rx);
    tiles[idx(rx, y)].terrain = 'river'; tiles[idx(rx, y)].flow = 'S';
    if (y > 0 && riverX[y - 1] !== rx) { tiles[idx(riverX[y - 1], y)].terrain = 'river'; tiles[idx(riverX[y - 1], y)].flow = 'E'; }
  }
  // Lac au nord-ouest avec une zone humide autour.
  const lx = 2, ly = 2;
  for (const [dx, dy] of [[0, 0], [1, 0], [0, 1], [1, 1], [2, 1]]) tiles[idx(lx + dx, ly + dy)].terrain = 'lake';
  for (const [dx, dy] of [[-1, 0], [2, 0], [-1, 1], [0, 2], [1, 2], [3, 1]]) {
    const x = lx + dx, y = ly + dy;
    if (x >= 0 && y >= 0 && x < cols && y < rows && tiles[idx(x, y)].terrain === 'grass') tiles[idx(x, y)].terrain = 'wetland';
  }
  // Collines au sud-ouest, forêt à l'est de la rivière et au nord, prairies et champs ailleurs.
  const paint = (terrain, cx, cy, r, p) => {
    for (let y = Math.max(0, cy - r); y <= Math.min(rows - 1, cy + r); y++) for (let x = Math.max(0, cx - r); x <= Math.min(cols - 1, cx + r); x++) {
      const t = tiles[idx(x, y)];
      if (t.terrain === 'grass' && Math.hypot(x - cx, y - cy) <= r + 0.5 && rnd() < p) t.terrain = terrain;
    }
  };
  paint('hill', 1, rows - 3, 2, 0.8);
  paint('forest', cols - 2, 3, 3, 0.85);
  paint('forest', cols - 2, rows - 5, 3, 0.75);
  paint('forest', 5, 0, 2, 0.6);
  paint('meadow', 2, Math.floor(rows / 2), 2, 0.7);
  paint('meadow', cols - 4, Math.floor(rows / 2) + 2, 2, 0.5);
  paint('field', 3, rows - 7, 2, 0.8);
  paint('field', cols - 3, rows - 1, 2, 0.7);

  // Ville : mairie au centre, puis îlots autour (≈ 50 en démo, tout le constructible en stress).
  const center = { x: Math.floor(cols / 2) - 1, y: Math.floor(rows / 2) };
  const types = ['house', 'house', 'house', 'house', 'shop', 'office', 'house', 'school', 'market', 'factory', 'clinic', 'park', 'solar', 'wind-turbine', 'house', 'house', 'orchard', 'hedge', 'tree-planting', 'house'];
  const buildable = (t) => t && !t.building && ['grass', 'meadow', 'field', 'forest'].includes(t.terrain);
  const place = (x, y, type, level = 1) => {
    const t = tiles[idx(x, y)];
    t.building = { type, level, variant: Math.floor(rnd() * 3), yaw: [0, 90, 180, 270][Math.floor(rnd() * 4)] };
    if (type === 'field') t.terrain = 'field';
    t.native = false;
  };
  place(center.x, center.y, 'townhall');
  const target = stress ? Infinity : 50;
  let count = 1;
  const maxR = stress ? Math.max(cols, rows) : 4;
  for (let r = 1; r <= maxR && count < target; r++) {
    const ring = [];
    for (let y = center.y - r; y <= center.y + r; y++) for (let x = center.x - r; x <= center.x + r; x++) {
      if (Math.max(Math.abs(x - center.x), Math.abs(y - center.y)) !== r) continue;
      if (x < 0 || y < 0 || x >= cols || y >= rows) continue;
      ring.push([x, y]);
    }
    for (const [x, y] of ring) {
      if (count >= target) break;
      const t = tiles[idx(x, y)];
      if (!buildable(t)) continue;
      if (!stress && t.terrain === 'forest' && rnd() < 0.7) continue; // on épargne la forêt
      if (stress && rnd() < 0.08) continue;                            // quelques trous
      const type = types[Math.floor(rnd() * types.length)];
      const level = type === 'house' ? (r <= 1 ? 3 : r <= 2 ? 2 : 1) : (type === 'shop' || type === 'factory' || type === 'office') && rnd() < 0.4 ? 2 : 1;
      place(x, y, type, level);
      count++;
    }
  }

  // Arêtes : rue entre deux îlots bâtis, chemin entre bâti et nature, rien entre deux natures.
  const urban = new Set(['house', 'shop', 'office', 'factory', 'school', 'clinic', 'market', 'townhall', 'tram-stop', 'wastewater', 'wind-turbine', 'solar', 'power-plant', 'compost', 'water-tower']);
  const built = (t) => t && t.building && urban.has(t.building.type);
  const water = (t) => t && (t.terrain === 'river' || t.terrain === 'lake');
  const h = new Uint8Array((rows + 1) * cols), v = new Uint8Array(rows * (cols + 1));
  const edgeValue = (a, b) => (built(a) && built(b) ? 2 : (built(a) || built(b)) && !water(a) && !water(b) ? 1 : 0);
  for (let y = 1; y < rows; y++) for (let x = 0; x < cols; x++) h[y * cols + x] = edgeValue(tiles[idx(x, y - 1)], tiles[idx(x, y)]);
  for (let y = 0; y < rows; y++) for (let x = 1; x < cols; x++) v[y * (cols + 1) + x] = edgeValue(tiles[idx(x - 1, y)], tiles[idx(x, y)]);
  // Une rue est-ouest qui franchit la rivière par un pont, au niveau de la mairie.
  const by = center.y;
  let crossed = 0;
  for (let x = center.x; x < cols - 1 && crossed < 2; x++) {
    const a = tiles[idx(x, by - 1)], b = tiles[idx(x, by)];
    const overWater = water(a) || water(b);
    h[by * cols + x] = overWater ? 3 : Math.max(h[by * cols + x], 2);
    if (!overWater && x > riverX[by]) crossed++;
  }
  const traffic = { h: new Float32Array(h.length), v: new Float32Array(v.length) };
  for (let x = center.x; x < center.x + 3; x++) traffic.h[by * cols + x] = 4 + x - center.x; // rues chargées pour voir la teinte
  return { seed, cols, rows, tiles, edges: { h, v }, traffic };
}

// --- Démarrage ------------------------------------------------------------------------------
const canvas = document.getElementById('map');
const statsEl = document.getElementById('stats');
const showStats = params.get('stats') === '1';
if (showStats) statsEl.style.display = 'block';

const world = demoWorld({ cols, rows, seed, stress });
let ready = false;
const tiletown = {
  ready: false,
  world,
  renderer: null,
  stats: () => (tiletown.renderer ? tiletown.renderer.stats() : null),
  /** Force n images et renvoie la médiane du temps CPU de rendu (ms). */
  renderFrames(n = 10) {
    const r = tiletown.renderer; if (!r) return null;
    const times = [];
    for (let i = 0; i < n; i++) { r.invalidate(); r.render(1 / 60); times.push(r.stats().frameMs); }
    times.sort((a, b) => a - b);
    return times[Math.floor(times.length / 2)];
  },
};
window.__tiletown = tiletown;

const renderer = await createRenderer(canvas, {
  manifestUrl: params.get('nomodels') === '1' ? null : '../assets/models/manifest.json',
  pixelRatioMax: 2,
  strategy: params.get('strategy') || 'auto',
  shadows: params.get('shadows') !== '0',
});
tiletown.renderer = renderer;
renderer.setWorld(world);
if (params.get('layer')) {
  const values = new Float32Array(cols * rows);
  for (let i = 0; i < values.length; i++) values[i] = (i % cols) / cols * 100;
  renderer.setLayer(params.get('layer'), values);
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  renderer.resize(w, h, window.devicePixelRatio || 1);
}
resize();
window.addEventListener('resize', () => { resize(); renderer.camera.fitAll(); });

// Gestes minimaux pour l'essai manuel : glisser = défiler, molette / pincement = zoom, double clic = tout voir.
const pointers = new Map();
let lastPinch = null;
canvas.addEventListener('pointerdown', (e) => { pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId); if (!p) return;
  if (pointers.size === 1) renderer.camera.pan(e.clientX - p.x, e.clientY - p.y);
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    if (lastPinch) renderer.camera.zoomAt(d / lastPinch, cx, cy);
    lastPinch = d;
  }
});
const up = (e) => { pointers.delete(e.pointerId); if (pointers.size < 2) lastPinch = null; };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', (e) => { e.preventDefault(); renderer.camera.zoomAt(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX, e.clientY); }, { passive: false });
canvas.addEventListener('dblclick', () => renderer.camera.fitAll());

let lastT = performance.now();
function loop(t) {
  const dt = (t - lastT) / 1000; lastT = t;
  const drew = renderer.render(dt);
  if (drew && !ready) { ready = true; tiletown.ready = true; }
  if (drew && showStats) {
    const s = renderer.stats();
    statsEl.textContent = `appels ${s.calls}  triangles ${s.triangles}  image ${s.frameMs.toFixed(1)} ms\n`
      + `stratégie ${s.strategy} (multi_draw ${s.multiDraw})  pixelRatio ${s.pixelRatio}\n`
      + `îlots+décors ${s.buildings.placements} (${s.buildings.uniqueModels} modèles, ${s.buildings.fallbacks} de remplacement)\n`
      + `rues ${s.roads.streets}  chemins ${s.roads.paths}  ponts ${s.roads.bridges}  nœuds ${s.roads.streetNodes}\n`
      + `zoom ${renderer.camera.state.zoom.toFixed(2)}  ${cols}×${rows}`;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
